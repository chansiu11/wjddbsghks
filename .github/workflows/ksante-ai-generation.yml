name: One-time anonymous AI 3D character study
on:
  push:
    paths:
      - '.github/workflows/ksante-ai-generation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-model:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install demo client
        run: python -m pip install --disable-pip-version-check gradio_client pillow numpy requests trimesh
      - name: Attempt free anonymous generation
        run: python scripts/generate_ksante_ai.py
      - name: Save model and reference for review (not deployed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksante-ai-generation-review
          path: build/ksante-ai/
          if-no-files-found: warn
          retention-days: 7

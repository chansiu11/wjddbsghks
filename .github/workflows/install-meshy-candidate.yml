name: Validate and install Meshy VTuber model

on:
  push:
    paths:
      - 'assets/uploads/Meshy_Gilded_Vanguard_rigged_preview.glb'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: meshy-avatar-release
  cancel-in-progress: false

jobs:
  validate-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing VTuber project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate skin, finger bones, and hair/cloth bones
        run: |
          test -s assets/uploads/Meshy_Gilded_Vanguard_rigged_preview.glb
          python scripts/validate_meshy_glb.py assets/uploads/Meshy_Gilded_Vanguard_rigged_preview.glb
          node scripts/validate_glb_adapter.mjs assets/uploads/Meshy_Gilded_Vanguard_rigged_preview.glb

      - name: Prepare Chromium test browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Load Meshy candidate inside real Kalidoface runtime
        run: python scripts/test_unquant_avatar_browser.py assets/uploads/Meshy_Gilded_Vanguard_rigged_preview.glb

      - name: Face-only and full-body stability regression for Meshy
        run: python scripts/test_avatar_height_tracking.py assets/uploads/Meshy_Gilded_Vanguard_rigged_preview.glb

      - name: Commit only after browser checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_meshy_candidate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/meshy-gilded-vanguard-rigged.glb assets/index.default-ai.js sw.js
          git commit -m "Install verified Meshy humanoid with hair and cloth spring helpers"
          git pull --rebase origin main
          git push origin HEAD:main
          # Attempt a Pages rebuild; GitHub Actions bot pushes may not start one.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages rebuild API unavailable"

      - name: Preserve screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshy-candidate-browser-qa
          path: |
            build/noquant-avatar-qa/
            build/height-regression/
          retention-days: 7
          if-no-files-found: warn

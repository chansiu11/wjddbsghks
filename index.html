<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14121d"><title>모션 스튜디오 · 웹 버튜버</title><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"}}</script></head>
<body><main id="app"><canvas id="scene" aria-label="3D 버튜버 아바타"></canvas><div class="stage-overlay"></div><header class="topbar"><div class="brand"><span class="brand-icon">✦</span><span>MOTION<span class="light">STUDIO</span><small>WEB VTUBER</small></span></div><div class="top-actions"><span id="trackingPill" class="pill"><i></i> 대기 중</span><button id="settingsBtn" class="iconbtn" aria-label="설정 열기" title="설정">⚙</button></div></header>
<div class="hero-label"><span class="eyebrow">YOUR STAGE, YOUR AVATAR</span><h1>움직이는 순간,<br><em>캐릭터가 됩니다.</em></h1><p>카메라 한 대로 얼굴, 몸, 손의 움직임을 3D 아바타에 담아보세요.</p><button id="startBtn" class="primary">◉ &nbsp; 카메라 시작하기</button></div>
<div id="cameraBox" class="camera-box" hidden><video id="camera" autoplay muted playsinline></video><span>● LIVE CAMERA</span><button id="hideCamera" aria-label="카메라 미리보기 숨기기">×</button></div>
<div class="bottombar"><div class="status-wrap"><span class="live-dot"></span><span id="status">카메라를 시작해 주세요</span><small id="metrics">—</small></div><div class="tools"><button id="modelBtn" title="VRM 모델 업로드">♙ <span>아바타</span></button><button id="backgroundBtn" title="배경 선택">▧ <span>배경</span></button><button id="cameraBtn" title="카메라 미리보기">▣ <span>카메라</span></button><button id="shotBtn" title="스냅샷 저장">◎ <span>사진</span></button><button id="fullBtn" title="전체 화면">⛶ <span>전체 화면</span></button></div></div>
<aside id="panel" class="panel" aria-label="설정" aria-hidden="true"><div class="panel-head"><div><span class="eyebrow">CUSTOMIZE</span><h2>스튜디오 설정</h2></div><button id="closePanel" class="iconbtn" aria-label="설정 닫기">×</button></div><div class="section"><h3>아바타</h3><p>기본 캐릭터 또는 내 VRM 모델을 사용하세요.</p><button id="defaultModel" class="choice selected">✦ 기본 캐릭터</button><button id="uploadModel" class="choice">＋ VRM 모델 불러오기</button><span id="modelName" class="subtle">선택한 모델: 기본 캐릭터</span></div><div class="section"><h3>배경</h3><div class="swatches"><button class="swatch active" data-bg="studio" style="--swatch:#2d2440" aria-label="스튜디오"></button><button class="swatch" data-bg="pink" style="--swatch:#b97499" aria-label="핑크"></button><button class="swatch" data-bg="green" style="--swatch:#00b34e" aria-label="크로마키 초록"></button><button class="swatch" data-bg="blue" style="--swatch:#1665df" aria-label="파랑"></button><button class="swatch" data-bg="transparent" style="--swatch:conic-gradient(#ddd 25%,#777 0 50%,#ddd 0 75%,#777 0) 0 0 / 12px 12px" aria-label="투명"></button></div><button id="uploadBg" class="choice">＋ 내 이미지 배경</button></div><div class="section"><h3>트래킹</h3><label class="toggle-row">전신 추적 <input type="checkbox" id="poseToggle" checked><span></span></label><label class="toggle-row">손가락 추적 <input type="checkbox" id="handToggle" checked><span></span></label><label class="toggle-row">카메라 좌우 반전 <input type="checkbox" id="mirrorToggle" checked><span></span></label></div><div class="section"><h3>화면</h3><label class="range-row">아바타 크기 <input id="zoom" type="range" min="2.5" max="6" step=".1" value="4.4"></label><p class="subtle">손가락으로 화면을 드래그하면 시점을 돌릴 수 있습니다.</p></div><button id="stopBtn" class="stop" hidden>카메라 중지</button><p class="footnote">영상은 기기에서 처리됩니다. 첫 실행 시 인식 모델을 다운로드합니다.</p></aside><div id="shade" class="shade" hidden></div><input id="modelFile" type="file" accept=".vrm" hidden><input id="bgFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><div id="toast" role="status" class="toast" hidden></div></main><script type="module" src="app.js?v=1"></script></body></html>

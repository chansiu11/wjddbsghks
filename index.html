<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1728"><title>Tab Motion 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#eefbff;background:#0c1728;font:16px system-ui,sans-serif}header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#111f35}h1{margin:0;font-size:20px}#metrics{color:#9fd2dc;font-size:13px}.view{position:relative;height:calc(100dvh - 125px);min-height:320px}#scene{width:100%;height:100%;display:block}#camera{position:absolute;right:14px;bottom:14px;width:min(25vw,180px);aspect-ratio:4/3;object-fit:cover;transform:scaleX(-1);border:2px solid #448f9b;border-radius:12px;background:#122b3a}footer{height:69px;padding:10px 14px;display:flex;align-items:center;gap:12px;background:#111f35}button{background:#37d7d4;border:0;border-radius:12px;padding:12px 20px;color:#06242d;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#stop{background:#d1e1eb}#status{color:#c8dce7;font-size:14px}p{margin:0}@media(max-width:700px){h1{font-size:17px}header{padding:11px}.view{height:calc(100dvh - 120px)}#camera{width:28vw}footer{padding:8px}#status{font-size:12px}}
</style></head><body><header><h1>Tab Motion 3D</h1><span id="metrics">준비 중</span></header><main class="view"><canvas id="scene" aria-label="3D 움직임 캐릭터"></canvas><video id="camera" playsinline muted autoplay aria-label="카메라 미리보기"></video></main><footer><button id="start">카메라 시작</button><button id="stop" hidden>중지</button><p id="status" role="status">버튼을 누르고 카메라 권한을 허용하세요</p></footer><script type="module" src="./web.js?v=3"></script></body></html>
